name: Refresh stats CSV

# Refreshes games_2022_2026.csv on a weekly schedule (incremental: scrapes only
# the current season and appends any round not already in the committed CSV).
#
# It deliberately does NOT rebuild or commit docs/index.html. The live page
# embeds Sportsbet "N+ disposals" odds, and Sportsbet geo-restricts to AU — a
# GitHub runner (non-AU IP) cannot fetch them, so a CI rebuild would publish an
# odds-less page and wipe the locally-built odds. The page is therefore built
# and committed from an AU machine (python matchup_app.py --odds). This job just
# keeps the underlying stats current; rebuild the page locally to publish.

on:
  workflow_dispatch:
    inputs:
      full_rescrape:
        description: "Re-scrape every season from scratch (backfill/repair)"
        type: boolean
        default: false
  schedule:
    # Tuesday 20:00 UTC (~Wed 06:00 AEST) — after the weekend round completes
    # and the upcoming fixture is set.
    - cron: "0 20 * * 2"

permissions:
  contents: write

concurrency:
  group: refresh-stats-csv
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser tests
        run: python3 test_parser.py

      - name: Refresh stats
        # Default = incremental (current season's new round only). Prior seasons
        # come from the committed CSV. full_rescrape forces a complete re-scrape.
        run: |
          if [ "${{ github.event.inputs.full_rescrape }}" = "true" ]; then
            python3 update_stats.py --full
          else
            python3 update_stats.py
          fi

      - name: Commit & push CSV if changed
        # Only the stats CSV — never docs/index.html (see header: the live page's
        # Sportsbet odds can only be fetched from an AU IP, so the page is built
        # and committed locally to avoid publishing an odds-less rebuild).
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games_2022_2026.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
          else
            git commit -m "Auto-refresh stats CSV ($(date -u +%Y-%m-%d))"
            git push
          fi
